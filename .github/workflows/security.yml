name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security:
    name: RLS / policy / SECURITY DEFINER scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static database security scan
        run: node scripts/security-scan.mjs

      - name: Dependency vulnerability audit
        run: bun audit --audit-level=high

      - name: Supabase database linter
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest inspect db lint --level warning --linked
